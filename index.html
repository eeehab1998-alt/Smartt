<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cart - مدرسة روّاد الغد النموذجية أريحا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #eff6ff 0%, #ffffff 100%); -webkit-tap-highlight-color: transparent; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #3b82f6 100%); }
        .gradient-btn { background: linear-gradient(90deg, #2563eb 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .gradient-btn:hover { background: linear-gradient(90deg, #1d4ed8 0%, #1e40af 100%); }
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #reader video { border-radius: 0.75rem; width: 100% !important; object-fit: cover; }
        #reader__dashboard_section_csr { display: none; }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:active { transform: scale(0.95); }
        .live-dot { animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes pop-in { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: pop-in 0.4s ease-out; }
    </style>
</head>
<body class="text-gray-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const resizeImage = (file, maxSize, callback) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        const ProductImage = ({ src, alt, className }) => {
            const [error, setError] = useState(false);
            if (!src || error) {
                return (
                    <div className={`flex items-center justify-center bg-blue-50 text-blue-300 ${className}`}>
                        <svg className="w-8 h-8 md:w-10 md:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    </div>
                );
            }
            return <img src={src} alt={alt} className={className} onError={() => setError(true)} />;
        };

        const getDeviceInfo = () => {
            const ua = navigator.userAgent;
            const isMobile = /Mobi|Mobile|Android|iPhone|iPad|iPod/.test(ua);
            let os = "Unknown OS";
            if (/Windows/.test(ua)) os = "Windows";
            else if (/Android/.test(ua)) os = "Android";
            else if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) os = "iOS";
            else if (/Mac OS/.test(ua)) os = "Mac OS";
            else if (/Linux/.test(ua)) os = "Linux";

            let browser = "Unknown Browser";
            if (/Chrome/.test(ua) && !/Edg/.test(ua) && !/OPR/.test(ua)) browser = "Chrome";
            else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = "Safari";
            else if (/Firefox/.test(ua)) browser = "Firefox";
            else if (/Edg/.test(ua)) browser = "Edge";

            return `${isMobile ? 'موبايل' : 'كمبيوتر'} (${os} - ${browser})`;
        };

        const initialProducts = {
            "6281001010011": { name: "مياه معدنية 500ml", price: 2.5, category: "مشروبات", image: "https://images.unsplash.com/photo-1560887961-9ba4b6d5d242?w=200&q=80" },
            "6281001010028": { name: "عصير برتقال", price: 6.0, category: "مشروبات", image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=200&q=80" },
            "6281001010035": { name: "كوكا كولا", price: 5.0, category: "مشروبات", image: "https://images.unsplash.com/photo-1554866585-cd94860890b7?w=200&q=80" },
            "6281001020035": { name: "تونة بالماء", price: 7.0, category: "معلبات", image: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=200&q=80" },
            "6281001020011": { name: "فول مدمس", price: 3.0, category: "معلبات", image: "https://images.unsplash.com/photo-1541529086526-db283c563270?w=200&q=80" },
            "6281001030028": { name: "كاجو محمص", price: 30.0, category: "مكسرات", image: "https://images.unsplash.com/photo-1535920726617-6f9c9b3c3c3c?w=200&q=80" },
            "6281001030011": { name: "لوز نيء", price: 25.0, category: "مكسرات", image: "https://images.unsplash.com/photo-1508743625643-3d3d3d3d3d3d?w=200&q=80" },
            "6281001040011": { name: "شوكولاتة داكنة", price: 8.0, category: "حلويات", image: "https://images.unsplash.com/photo-1546171753-97d7676e4602?w=200&q=80" },
            "6281001050011": { name: "حليب كامل الدسم", price: 6.5, category: "ألبان", image: "https://images.unsplash.com/photo-1563636619-e9143da7973b?w=200&q=80" },
            "6281001060011": { name: "صابون غسيل", price: 8.0, category: "منظفات", image: "https://images.unsplash.com/photo-1584559582841-66b4d0c3d3d3?w=200&q=80" }
        };

        const initialDB = {
            malls: { 
                "JERICHO001": { 
                    name: "سوبر ماركت روّاد الغد", password: "1234", currency: "شيكل", id: "JERICHO001", 
                    categories: ["مشروبات", "معلبات", "مكسرات", "حلويات", "ألبان", "منظفات"],
                    products: initialProducts,
                    cart: { items: [], buyer: null, status: 'active', exitCode: null, auditRequired: false },
                    transactions: []
                } 
            }
        };

        const App = () => {
            const [view, setView] = useState('home');
            const [session, setSession] = useState(null);
            const [isSynced, setIsSynced] = useState(false);
            const [isOnline, setIsOnline] = useState(false);
            const [cloudDB, setCloudDB] = useState(initialDB);
            
            const clientRef = useRef(null);
            const dbRef = useRef(initialDB);
            const isSyncedRef = useRef(false);
            const DB_TOPIC = "smart_cart_jericho_v15_isolated_sync";

            useEffect(() => { dbRef.current = cloudDB; }, [cloudDB]);

            useEffect(() => {
                const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
                clientRef.current = client;

                client.on('connect', () => {
                    setIsOnline(true);
                    client.subscribe(DB_TOPIC, { qos: 1 }, (err) => {
                        if (!err) {
                            client.publish(DB_TOPIC, JSON.stringify({ type: 'sync_request' }), { qos: 1 });
                            setTimeout(() => {
                                if (!isSyncedRef.current) {
                                    isSyncedRef.current = true;
                                    client.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: dbRef.current }), { retain: true, qos: 1 });
                                    setIsSynced(true);
                                }
                            }, 1500);
                        }
                    });
                });

                client.on('offline', () => setIsOnline(false));
                client.on('error', () => setIsOnline(false));

                client.on('message', (topic, message) => {
                    if (topic === DB_TOPIC) {
                        const msg = JSON.parse(message.toString());
                        if (msg.type === 'sync_request') {
                            if (isSyncedRef.current) client.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: dbRef.current }), { retain: true, qos: 1 });
                        } else if (msg.type === 'db_update' && msg.data) {
                            dbRef.current = msg.data;
                            setCloudDB(msg.data);
                            if (!isSyncedRef.current) {
                                isSyncedRef.current = true;
                                setIsSynced(true);
                            }
                        }
                    }
                });

                return () => { if (client) client.end(); };
            }, []);

            const pushToCloud = (newDB) => {
                dbRef.current = newDB;
                setCloudDB(newDB);
                if (clientRef.current && clientRef.current.connected) {
                    clientRef.current.publish(DB_TOPIC, JSON.stringify({ type: 'db_update', data: newDB }), { retain: true, qos: 1 });
                }
            };

            const updateMallData = (mallId, newMallData) => {
                const newMalls = { ...dbRef.current.malls, [mallId]: newMallData };
                pushToCloud({ ...dbRef.current, malls: newMalls });
            };

            const startSession = (newSession) => {
                setSession(newSession);
                setView('app');
                if (newSession.type === 'buyer') {
                    const mall = dbRef.current.malls[newSession.mallId];
                    const newCart = { items: [], buyer: { name: newSession.buyerName, phone: newSession.buyerPhone, ip: newSession.buyerIP, device: newSession.buyerDevice }, status: 'active', exitCode: null, auditRequired: false };
                    updateMallData(newSession.mallId, { ...mall, cart: newCart });
                }
            };

            const handleLogout = () => { setSession(null); setView('home'); };

            if (!isSynced) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gradient-bg text-white p-4">
                        <div className="w-16 h-16 border-4 border-white/30 border-t-white rounded-full loader mb-4"></div>
                        <h2 className="text-2xl font-bold">Smart Cart</h2>
                        <p className="text-blue-100 mt-2 text-center">مدرسة روّاد الغد النموذجية - أريحا</p>
                        <p className="text-blue-200 text-sm mt-4">جاري الاتصال بالخادم السحابي العالمي...</p>
                    </div>
                );
            }

            if (view === 'home') return <HomeScreen setView={setView} isOnline={isOnline} />;
            if (view === 'buyerEntry') return <BuyerEntryScreen setView={setView} startSession={startSession} malls={cloudDB.malls} />;
            if (view === 'staffLogin') return <StaffLoginScreen setView={setView} startSession={startSession} malls={cloudDB.malls} />;
            if (view === 'register') return <RegisterScreen onBack={() => setView('staffLogin')} malls={cloudDB.malls} pushToCloud={pushToCloud} dbRef={dbRef} />;

            if (view === 'app' && session) {
                const mallInfo = cloudDB.malls[session.mallId] || { name: 'متجر غير معروف', currency: 'شيكل', products: {}, categories: [], cart: { items: [], buyer: null, status: 'active' }, transactions: [] };

                return (
                    <div className="min-h-screen flex flex-col pb-10">
                        <header className="gradient-bg text-white p-3 md:p-4 flex justify-between items-center sticky top-0 z-30 shadow-lg">
                            <div className="flex items-center gap-2 md:gap-3">
                                <div className="bg-white/20 p-1.5 md:p-2 rounded-xl backdrop-blur-sm">
                                    <svg className="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </div>
                                <div>
                                    <h1 className="font-bold text-sm md:text-lg leading-tight">Smart Cart</h1>
                                    <p className="text-[10px] md:text-xs text-blue-100 flex items-center gap-1">
                                        {session.type === 'buyer' ? `مرحباً ${session.buyerName}` : session.role === 'cashier' ? 'بوابة الأمن والطلبات' : 'لوحة المالك'}
                                        {isOnline && <span className="w-2 h-2 bg-green-300 rounded-full live-dot mr-1"></span>}
                                    </p>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="bg-white/20 hover:bg-white/30 px-3 py-1.5 md:px-4 md:py-2 rounded-lg text-xs md:text-sm font-bold">خروج</button>
                        </header>

                        <main className="flex-1 p-3 md:p-8 max-w-7xl mx-auto w-full">
                            {session.type === 'buyer' && <CartView mallInfo={mallInfo} updateMallData={updateMallData} />}
                            {session.type === 'staff' && session.role === 'cashier' && <SecurityView mallInfo={mallInfo} updateMallData={updateMallData} />}
                            {session.type === 'staff' && session.role === 'owner' && <OwnerDashboard mallInfo={mallInfo} updateMallData={updateMallData} />}
                        </main>
                        
                        <footer className="text-center py-4 text-[10px] md:text-xs text-gray-400 border-t border-gray-100 mt-8">
                            مشروع تخرج - مدرسة روّاد الغد النموذجية - أريحا © 2024
                        </footer>
                    </div>
                );
            }
            return null;
        };

        const HomeScreen = ({ setView, isOnline }) => (
            <div className="min-h-screen flex flex-col items-center justify-center gradient-bg p-4 text-center">
                <div className="bg-white/10 backdrop-blur-md p-6 md:p-10 rounded-3xl border border-white/20 max-w-lg w-full">
                    <div className="mb-6">
                        <h1 className="text-4xl md:text-5xl font-extrabold text-white tracking-tight">Smart Cart</h1>
                        <p className="text-blue-200 mt-2 text-base md:text-lg">امسح، أرسل، اخرج</p>
                    </div>
                    <div className="bg-white text-blue-800 py-2 px-4 rounded-full inline-block mb-8 text-xs md:text-sm font-bold">
                        مدرسة روّاد الغد النموذجية - أريحا
                    </div>
                    <div className="space-y-4">
                        <button onClick={() => setView('buyerEntry')} className="w-full bg-white text-blue-800 py-3 md:py-4 rounded-xl font-extrabold text-base md:text-lg hover:bg-blue-50 transition shadow-lg flex items-center justify-center gap-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            أنا مشتري (ابدأ التسوق)
                        </button>
                        <button onClick={() => setView('staffLogin')} className="w-full bg-blue-900/40 text-white border-2 border-white/30 py-3 md:py-4 rounded-xl font-bold text-base md:text-lg hover:bg-blue-900/60 transition">
                            إدارة المتجر (مالك / أمن)
                        </button>
                    </div>
                    <div className={`mt-6 text-xs font-bold ${isOnline ? 'text-green-300' : 'text-red-300'}`}>
                        الحالة: {isOnline ? '☁️ متصل بالسحابة عالمياً' : '⛔ غير متصل'}
                    </div>
                </div>
            </div>
        );

        const BuyerEntryScreen = ({ setView, startSession, malls }) => {
            const [mallId, setMallId] = useState('JERICHO001');
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [ip, setIp] = useState('جاري الجلب...');
            const [device] = useState(getDeviceInfo());
            const [error, setError] = useState('');

            useEffect(() => {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => setIp(data.ip))
                    .catch(() => setIp('غير معروف'));
            }, []);

            const submit = (e) => {
                e.preventDefault();
                if (!malls[mallId.toUpperCase()]) { setError("رقم المتجر غير صحيح."); return; }
                const phoneRegex = /^(056|059)\d{7}$/;
                if (!phoneRegex.test(phone)) { setError("رقم الهاتف يجب أن يبدأ بـ 056 أو 059."); return; }
                startSession({ type: 'buyer', mallId: mallId.toUpperCase(), buyerName: name, buyerPhone: phone, buyerIP: ip, buyerDevice: device });
            };

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-md">
                        <button onClick={() => setView('home')} className="text-blue-600 mb-4 text-sm font-bold">&larr; رجوع</button>
                        <h2 className="text-xl md:text-2xl font-extrabold text-blue-900 mb-2">تسجيل دخول المشتري</h2>
                        <p className="text-blue-500 mb-6 text-xs md:text-sm">أدخل بياناتك لربط سلتك بحسابك</p>
                        <form onSubmit={submit} className="space-y-4">
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-blue-800 mb-1">رقم تعريف المتجر</label>
                                <input type="text" value={mallId} onChange={e => setMallId(e.target.value)} className="w-full px-4 py-2.5 md:py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" required />
                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-blue-800 mb-1">الاسم الكامل</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-2.5 md:py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="اسمك" required />
                            </div>
                            <div>
                                <label className="block text-xs md:text-sm font-bold text-blue-800 mb-1">رقم الهاتف</label>
                                <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-4 py-2.5 md:py-3 bg-blue-50 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="056xxxxxxx" required />
                            </div>
                            
                            <div className="bg-gray-50 p-3 rounded-xl text-xs text-gray-500 space-y-1">
                                <div className="flex justify-between"><span>📱 نوع الجهاز:</span> <span className="font-bold text-gray-700">{device}</span></div>
                                <div className="flex justify-between"><span>🌐 عنوان IP:</span> <span className="font-bold text-gray-700">{ip}</span></div>
                            </div>

                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm">{error}</div>}
                            <button type="submit" className="w-full gradient-btn text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg shadow-lg">ابدأ التسوق</button>
                        </form>
                    </div>
                </div>
            );
        };

        const StaffLoginScreen = ({ setView, startSession, malls }) => {
            const [mallId, setMallId] = useState('JERICHO001');
            const [password, setPassword] = useState('');
            const [role, setRole] = useState('owner');
            const [error, setError] = useState('');

            const submit = (e) => {
                e.preventDefault();
                if (malls[mallId.toUpperCase()] && malls[mallId.toUpperCase()].password === password) {
                    startSession({ type: 'staff', mallId: mallId.toUpperCase(), role });
                } else { setError("بيانات الدخول غير صحيحة."); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-md">
                        <button onClick={() => setView('home')} className="text-blue-600 mb-4 text-sm font-bold">&larr; رجوع</button>
                        <h2 className="text-xl md:text-2xl font-extrabold text-blue-900 mb-6">دخول إدارة المتجر</h2>
                        <form onSubmit={submit} className="space-y-4">
                            <input type="text" value={mallId} onChange={e => setMallId(e.target.value)} placeholder="رقم المتجر" className="w-full px-4 py-2.5 md:py-3 bg-blue-50 rounded-xl outline-none" required />
                            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="كلمة السر" className="w-full px-4 py-2.5 md:py-3 bg-blue-50 rounded-xl outline-none" required />
                            <div className="grid grid-cols-2 gap-2">
                                <button type="button" onClick={() => setRole('cashier')} className={`p-2 md:p-3 rounded-xl font-bold text-xs md:text-sm ${role === 'cashier' ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>بوابة الأمن</button>
                                <button type="button" onClick={() => setRole('owner')} className={`p-2 md:p-3 rounded-xl font-bold text-xs md:text-sm ${role === 'owner' ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>مالك المتجر</button>
                            </div>
                            {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm">{error}</div>}
                            <button type="submit" className="w-full gradient-btn text-white py-3 rounded-xl font-bold">دخول</button>
                            <button type="button" onClick={() => setView('register')} className="w-full text-blue-600 text-sm py-2">متجر جديد؟ اشترك</button>
                        </form>
                    </div>
                </div>
            );
        };

        const RegisterScreen = ({ onBack, malls, pushToCloud, dbRef }) => {
            const [name, setName] = useState('');
            const [id, setId] = useState('');
            const [pass, setPass] = useState('');
            const [done, setDone] = useState(false);

            const submit = (e) => {
                e.preventDefault();
                if (malls[id.toUpperCase()]) { alert("مسجل مسبقاً!"); return; }
                const newMall = { 
                    name, password: pass, currency: "شيكل", id: id.toUpperCase(), 
                    categories: ["عام"], products: {},
                    cart: { items: [], buyer: null, status: 'active', exitCode: null, auditRequired: false },
                    transactions: []
                };
                pushToCloud({ ...dbRef.current, malls: { ...malls, [id.toUpperCase()]: newMall } });
                setDone(true); setTimeout(onBack, 2000);
            };

            if (done) return <div className="min-h-screen flex items-center justify-center gradient-bg text-white text-xl md:text-2xl font-bold p-4 text-center">تم التسجيل بنجاح!</div>;

            return (
                <div className="min-h-screen flex items-center justify-center gradient-bg p-4">
                    <div className="glass-card rounded-3xl shadow-2xl p-6 md:p-8 w-full max-w-md">
                        <h2 className="text-xl md:text-2xl font-extrabold text-blue-900 mb-6 text-center">تسجيل متجر جديد</h2>
                        <form onSubmit={submit} className="space-y-4">
                            <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder="اسم المتجر" className="w-full px-4 py-2.5 md:py-3 bg-white/80 rounded-xl outline-none" required />
                            <input type="text" value={id} onChange={e=>setId(e.target.value)} placeholder="رقم تعريف (Mall ID)" className="w-full px-4 py-2.5 md:py-3 bg-white/80 rounded-xl outline-none" required />

                        </form>
                    </div>
                </div>
            );
        };

        const CartView = ({ mallInfo, updateMallData }) => {
            const cartData = mallInfo.cart;
            const [showScanner, setShowScanner] = useState(false);
            const [scanStatus, setScanStatus] = useState(null);
            const [activeCat, setActiveCat] = useState(mallInfo.categories[0] || "");
            const scannerRef = useRef(null);
            const lastScanRef = useRef({ text: null, time: 0 });

            const totalPrice = cartData.items.reduce((s, i) => s + i.price * i.qty, 0);

            const updateCart = (newCart) => updateMallData(mallInfo.id, { ...mallInfo, cart: newCart });

            const addProduct = (barcode) => {
                if (cartData.status !== 'active') return;
                const p = mallInfo.products[barcode];
                if (!p) { 
                    setScanStatus({ type: 'error', message: 'الباركود غير معروف' });
                    return; 
                }
                const items = [...cartData.items];
                const ex = items.find(i => i.barcode === barcode);
                if (ex) ex.qty++; else items.push({ ...p, barcode, qty: 1 });
                updateCart({ ...cartData, items });
                setScanStatus({ type: 'success', message: `تم إضافة: ${p.name}` });
                if (navigator.vibrate) navigator.vibrate(100);
            };

            useEffect(() => {
                let isMounted = true;
                const startScanner = async () => {
                    await new Promise(r => setTimeout(r, 100));
                    if (!isMounted) return;
                    const element = document.getElementById("reader");
                    if (!element) return;
                    const html5QrCode = new Html5Qrcode("reader");
                    scannerRef.current = html5QrCode;
                    try {
                        await html5QrCode.start(
                            { facingMode: "environment" }, 
                            { fps: 10, qrbox: { width: 200, height: 200 } }, 
                            (decodedText) => {
                                const now = Date.now();
                                if (lastScanRef.current.text === decodedText && now - lastScanRef.current.time < 2000) return;
                                lastScanRef.current = { text: decodedText, time: now };
                                addProduct(decodedText);
                            }, 
                            () => {}
                        );
                    } catch (err) {
                        setScanStatus({ type: 'error', message: "تعذر تشغيل الكاميرا. تأكد من منح الإذن للموقع." });
                    }
                };
                const stopScanner = async () => {
                    if (scannerRef.current && scannerRef.current.isScanning) {
                        try { await scannerRef.current.stop(); scannerRef.current.clear(); } catch (err) {}
                    }
                };
                if (showScanner) { setScanStatus(null); startScanner(); } 
                else { stopScanner(); }
                return () => { isMounted = false; stopScanner(); };
            }, [showScanner]);

            const changeQty = (barcode, delta) => {
                if (cartData.status !== 'active') return;
                const items = cartData.items.map(i => {
                    if (i.barcode === barcode) {
                        const newQty = i.qty + delta;
                        return newQty > 0 ? { ...i, qty: newQty } : null;
                    }
                    return i;
                }).filter(Boolean);
                updateCart({ ...cartData, items });
            };

            const sendOrder = () => {
                if (cartData.items.length === 0) return;
                updateCart({ ...cartData, status: 'pending' });
                alert("تم إرسال طلبك بنجاح! يرجى الانتظار حتى يقوم المتجر بتأكيد الطلب.");
            };

            if (cartData.status === 'pending') {
                return (
                    <div className="max-w-md mx-auto glass-card rounded-3xl shadow-xl p-6 md:p-8 text-center border-t-4 border-amber-500 mt-10 pop-in">
                        <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg className="w-12 h-12 text-amber-600 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <h2 className="text-xl md:text-2xl font-extrabold text-gray-800 mb-2">تم إرسال طلبك بنجاح</h2>
                        <p className="text-gray-500 mb-6 text-sm md:text-base">المبلغ المطلوب دفعه: <span className="font-bold text-amber-600">{totalPrice.toFixed(2)} {mallInfo.currency}</span></p>

                            <p className="font-bold text-amber-800 text-sm mb-1">⏳ بانتظار موافقة المتجر</p>

                        </div>
                        <h2 className="text-xl md:text-2xl font-extrabold text-gray-800 mb-2">تمت عملية الشراء بنجاح! 🎉</h2>

                        {cartData.auditRequired ? (

                                <p className="text-sm text-blue-600">✅ خروج مباشر</p>
                            </div>

                        <div className="bg-gray-900 text-white rounded-2xl p-4 md:p-6 mb-6">
                            <p className="text-xs text-gray-400 mb-2">رمز الخروج (للحارس)</p>
                            <p className="text-4xl md:text-5xl font-bold tracking-widest text-emerald-400">{cartData.exitCode}</p>
                        </div>
                        
                        <button onClick={() => updateCart({ items: [], buyer: cartData.buyer, status: 'active', exitCode: null, auditRequired: false })} className="w-full bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-sm md:text-base">
                            إنهاء الجلسة وبدء تسوق جديد
                        </button>
                    </div>
                );
            }

            const filteredProducts = Object.keys(mallInfo.products).filter(b => mallInfo.products[b].category === activeCat);

            return (
                <div className="flex flex-col lg:grid lg:grid-cols-12 gap-4 lg:gap-6 max-w-7xl mx-auto">
                    
                    <div className="lg:col-span-6 lg:order-2 glass-card rounded-2xl lg:rounded-3xl p-3 lg:p-4">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-base lg:text-xl font-extrabold text-blue-900">منتجات: {activeCat}</h2>
                            <button onClick={() => setShowScanner(true)} className="gradient-btn text-white px-3 py-1.5 lg:px-4 lg:py-2 rounded-lg font-bold text-xs lg:text-sm flex items-center gap-1.5">
                                <svg className="w-4 h-4 lg:w-5 lg:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h2m12 0h2M4 12h16M4 18h2m12 0h2M6 4v16M18 4v16"></path></svg>
                                مسح
                            </button>
                        </div>
                        
                        <div className="flex lg:hidden gap-2 overflow-x-auto scrollbar-hide pb-2 mb-3 border-b border-gray-100">
                            {mallInfo.categories.map(cat => (
                                <button key={cat} onClick={() => setActiveCat(cat)} className={`px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap ${activeCat === cat ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>{cat}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 lg:grid-cols-3 gap-2 lg:gap-4 max-h-[55vh] lg:max-h-[600px] overflow-y-auto scrollbar-hide pl-1">
                            {filteredProducts.map(barcode => {
                                const p = mallInfo.products[barcode];
                                return (
                                    <div key={barcode} className="product-card bg-white rounded-xl lg:rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                                        <div className="h-20 lg:h-28 bg-gray-100 overflow-hidden">
                                            <ProductImage src={p.image} alt={p.name} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="p-2 lg:p-3 flex-1 flex flex-col justify-between">
                                            <div>
                                                <h4 className="font-bold text-gray-800 text-xs lg:text-sm leading-tight mb-0.5 lg:mb-1 line-clamp-2">{p.name}</h4>
                                                <p className="text-blue-600 font-extrabold text-xs lg:text-sm">{p.price.toFixed(2)} {mallInfo.currency}</p>
                                            </div>
                                            <button onClick={() => addProduct(barcode)} className="mt-1 lg:mt-2 w-full bg-blue-100 text-blue-700 py-1 rounded-md text-xs font-bold hover:bg-blue-200 transition">إضافة</button>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <div className="lg:col-span-3 lg:order-1 glass-card rounded-2xl lg:rounded-3xl p-3 lg:p-4 h-fit lg:sticky lg:top-24 border-t-4 border-blue-500 mt-4 lg:mt-0">
                        <h2 className="text-base lg:text-xl font-extrabold text-blue-900 mb-3 lg:mb-4">سلة التسوق</h2>
                        <div className="bg-blue-50/50 rounded-xl lg:rounded-2xl p-2 lg:p-2 flex-1 max-h-[40vh] lg:max-h-[400px] overflow-y-auto scrollbar-hide mb-3 lg:mb-4 border border-blue-100">
                            {cartData.items.length === 0 ? <div className="p-4 text-center text-blue-300 text-xs lg:text-sm">سلتك فارغة.<br/>أضف منتجات أو امسح الباركود.</div> : 
                                cartData.items.map(item => (
                                    <div key={item.barcode} className="flex justify-between items-center bg-white p-1.5 lg:p-2 mb-1.5 lg:mb-2 rounded-lg lg:rounded-xl shadow-sm">
                                        <div className="flex items-center gap-1.5 lg:gap-2">
                                            <ProductImage src={item.image} alt={item.name} className="w-8 h-8 lg:w-10 lg:h-10 rounded-md object-cover" />
                                            <div><p className="font-bold text-gray-800 text-[10px] lg:text-xs">{item.name}</p></div>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <div className="flex items-center bg-blue-50 rounded-md p-0.5">
                                                <button onClick={() => changeQty(item.barcode, -1)} className="w-5 h-5 flex items-center justify-center text-blue-600 font-bold text-xs">-</button>
                                                <span className="w-5 text-center font-bold text-gray-800 text-xs">{item.qty}</span>
                                                <button onClick={() => changeQty(item.barcode, 1)} className="w-5 h-5 flex items-center justify-center text-blue-600 font-bold text-xs">+</button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            }
                        </div>
                        <div className="border-t-2 border-blue-100 pt-3">
                            <div className="flex justify-between items-center mb-3">
                                <div><p className="text-[10px] lg:text-xs text-blue-500">الإجمالي</p><p className="text-lg lg:text-2xl font-extrabold text-blue-700">{totalPrice.toFixed(2)} <span className="text-xs lg:text-sm">{mallInfo.currency}</span></p></div>
                                <button onClick={sendOrder} disabled={cartData.items.length === 0} className={`px-4 py-2 rounded-lg font-bold text-white text-xs lg:text-sm ${cartData.items.length === 0 ? 'bg-gray-300' : 'bg-emerald-500'}`}>إرسال الطلب</button>
                            </div>
                        </div>
                    </div>

                    <div className="hidden lg:block lg:col-span-3 lg:order-3 glass-card rounded-3xl p-4 h-fit lg:sticky lg:top-24">

                        <div className="flex flex-col gap-2">
                            {mallInfo.categories.map(cat => (
                                <button key={cat} onClick={() => setActiveCat(cat)} className={`px-4 py-2 rounded-xl font-bold text-sm text-right ${activeCat === cat ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>{cat}</button>
                            ))}
                        </div>
                    </div>

                    {showScanner && (
                        <div className="fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-50 p-2 md:p-4">
                            <div className="bg-white rounded-xl md:rounded-2xl p-3 md:p-4 w-full max-w-md flex flex-col">
                                <h3 className="font-bold text-base md:text-lg mb-3 text-center">وجّه الكاميرا للباركود</h3>
                                <div id="reader" className="w-full h-[300px] md:h-[400px] bg-gray-900 rounded-xl overflow-hidden"></div>
                                
                                {scanStatus && (
                                    <div className={`mt-3 p-2 rounded-lg text-center font-bold text-sm ${scanStatus.type === 'success' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}`}>
                                        {scanStatus.message}
                                    </div>
                                )}
                                
                                <button onClick={() => setShowScanner(false)} className="mt-3 w-full bg-blue-100 py-2.5 rounded-lg font-bold text-blue-800 text-sm">إغلاق الماسح</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SecurityView = ({ mallInfo, updateMallData }) => {
            const cart = mallInfo.cart;
            const transactions = mallInfo.transactions || [];
            const totalPrice = cart.items.reduce((s, i) => s + i.price * i.qty, 0);

            const approveOrder = () => {
                const exitCode = Math.floor(100000 + Math.random() * 900000);
                const auditRequired = Math.random() < 0.2;
                const newTransactions = [...transactions, {
                    id: Date.now().toString(), 
                    mallId: mallInfo.id, buyer: cart.buyer, items: cart.items, total: totalPrice, date: new Date().toISOString(), auditRequired
                }];
                updateMallData(mallInfo.id, { ...mallInfo, transactions: newTransactions, cart: { ...cart, status: 'approved', exitCode, auditRequired } });
                alert("✅ تمت الموافقة على الطلب، وتم حفظ البيانات في السجل المالي بنجاح.");
            };

            const clearCartForNewCustomer = () => {
                updateMallData(mallInfo.id, { ...mallInfo, cart: { items: [], buyer: null, status: 'active', exitCode: null, auditRequired: false } });
            };

            return (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 max-w-4xl mx-auto">
                    <div className="glass-card rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-6 order-2 md:order-1">
                        <h2 className="text-lg md:text-xl font-extrabold text-blue-900 mb-4">سجل عمليات اليوم (المحفوظات)</h2>
                        <div className="space-y-3 max-h-[400px] md:max-h-[500px] overflow-y-auto scrollbar-hide">
                            {transactions.length === 0 ? <p className="text-center text-gray-400 p-8 text-sm">لا توجد معاملات محفوظة بعد.</p> : transactions.slice().reverse().map((tx, idx) => (
                                <div key={tx.id || idx} className="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between mb-2">
                                        <span className="font-bold text-gray-800 text-sm md:text-base">{tx.buyer?.name}</span>
                                        <span className="font-bold text-emerald-600 text-sm md:text-base">{tx.total.toFixed(2)} {mallInfo.currency}</span>
                                    </div>
                                    <div className="flex justify-between text-[10px] md:text-xs text-gray-500">
                                        <span>{tx.buyer?.phone}</span>
                                        <span>{tx.auditRequired ? '🛑 تدقيق' : '✅ مباشر'}</span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="glass-card rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-6 order-1 md:order-2">
                        <h2 className="text-lg md:text-xl font-extrabold text-blue-900 mb-4">الطلبات الواردة</h2>
                        {cart.buyer ? (
                            <div className="bg-blue-50 p-3 rounded-xl mb-4 border border-blue-100 space-y-1">
                                <p className="text-xs md:text-sm text-gray-600">المشتري: <span className="font-bold text-blue-900">{cart.buyer.name}</span></p>
                                <p className="text-xs md:text-sm text-gray-600">الهاتف: <span className="font-bold text-blue-900">{cart.buyer.phone}</span></p>

                                <p className="text-xs md:text-sm text-gray-600">🌐 IP: <span className="font-bold text-blue-900">{cart.buyer.ip}</span></p>
                            </div>
                        ) : <p className="text-gray-400 mb-4 text-sm">لا يوجد طلبات واردة حالياً.</p>}

                        {cart.status === 'pending' ? (

        const OwnerDashboard = ({ mallInfo, updateMallData }) => {
            const [activeCategory, setActiveCategory] = useState(mallInfo.categories[0] || "");
            const [showProductForm, setShowProductForm] = useState(false);
            const [confirmDel, setConfirmDel] = useState(null); 
            const [confirmDelTx, setConfirmDelTx] = useState(null); 
            const [confirmClearAll, setConfirmClearAll] = useState(false); 
            const [newCat, setNewCat] = useState(''); // لإضافة الأقسام
            
            const [pBarcode, setPBarcode] = useState('');
            const [pName, setPName] = useState('');
            const [pPrice, setPPrice] = useState('');
            const [pCategory, setPCategory] = useState(mallInfo.categories[0] || "");
            const [pImage, setPImage] = useState('');

            const transactions = mallInfo.transactions || [];
            const totalRevenue = transactions.reduce((s, t) => s + t.total, 0);
            const liveCart = mallInfo.cart;
            const liveCartTotal = liveCart.items.reduce((s, i) => s + i.price * i.qty, 0);

            const approveOrder = () => {
                const exitCode = Math.floor(100000 + Math.random() * 900000);
                const auditRequired = Math.random() < 0.2;
                const newTransactions = [...transactions, {
                    id: Date.now().toString(), 
                    mallId: mallInfo.id, buyer: liveCart.buyer, items: liveCart.items, total: liveCartTotal, date: new Date().toISOString(), auditRequired
                }];
                updateMallData(mallInfo.id, { ...mallInfo, transactions: newTransactions, cart: { ...liveCart, status: 'approved', exitCode, auditRequired } });
                alert("✅ تمت الموافقة على الطلب، وتم حفظ البيانات في السجل المالي بنجاح.");
            };

            const clearCartForNewCustomer = () => {
                updateMallData(mallInfo.id, { ...mallInfo, cart: { items: [], buyer: null, status: 'active', exitCode: null, auditRequired: false } });
            };

            const deleteTransaction = (id) => {
                const newTransactions = transactions.filter(tx => tx.id !== id);
                updateMallData(mallInfo.id, { ...mallInfo, transactions: newTransactions });
                setConfirmDelTx(null);
            };

            const clearAllTransactions = () => {
                updateMallData(mallInfo.id, { ...mallInfo, transactions: [] });
                setConfirmClearAll(false);
            };

            // دالة إضافة قسم جديد
            const addCategory = (e) => {
                e.preventDefault();
                if (!newCat.trim()) return;
                if (mallInfo.categories.includes(newCat.trim())) { alert("القسم موجود مسبقاً"); return; }
                updateMallData(mallInfo.id, { ...mallInfo, categories: [...mallInfo.categories, newCat.trim()] });
                setNewCat('');
                setActiveCategory(newCat.trim());
            };

            useEffect(() => { if (!mallInfo.categories.includes(activeCategory)) setActiveCategory(mallInfo.categories[0] || ""); }, [mallInfo.categories]);

            const addProduct = (e) => {
                e.preventDefault();
                if (mallInfo.products[pBarcode]) { alert("هذا الباركود مسجل!"); return; }
                const newProduct = { name: pName, price: parseFloat(pPrice), category: pCategory, image: pImage };
                updateMallData(mallInfo.id, { ...mallInfo, products: { ...mallInfo.products, [pBarcode]: newProduct } });
                setPBarcode(''); setPName(''); setPPrice(''); setPImage('');
                setShowProductForm(false);
            };

            const executeDelete = (barcode) => {
                const newProducts = { ...mallInfo.products };
                delete newProducts[barcode];
                updateMallData(mallInfo.id, { ...mallInfo, products: newProducts });
                setConfirmDel(null);
            };

            const filteredProducts = Object.keys(mallInfo.products).filter(b => mallInfo.products[b].category === activeCategory);

            return (
                <div className="max-w-6xl mx-auto space-y-6 md:space-y-8">
                    <div className={`glass-card rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-6 border-t-4 ${liveCart.status === 'pending' ? 'border-amber-500' : 'border-emerald-500'}`}>
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-base md:text-xl font-extrabold text-blue-900 flex items-center gap-2">
                                <span className={`w-2.5 h-2.5 md:w-3 md:h-3 rounded-full live-dot ${liveCart.status === 'pending' ? 'bg-amber-500' : 'bg-emerald-500'}`}></span>
                                {liveCart.status === 'pending' ? 'طلب وارد بانتظار الموافقة' : 'مراقبة السلة الحية'}
                            </h2>
                            <span className="font-bold text-emerald-600 text-sm md:text-base">{liveCartTotal.toFixed(2)} {mallInfo.currency}</span>
                        </div>
                        
                        {liveCart.buyer ? (
                            <>
                                <div className="bg-blue-50 p-2 md:p-3 rounded-xl mb-4 border border-blue-100 flex flex-col md:flex-row justify-between md:items-center gap-2">
                                    <div className="space-y-1">
                                        <p className="text-[10px] md:text-xs text-blue-400">المشتري الحالي</p>
                                        <p className="font-bold text-blue-900 text-xs md:text-base">{liveCart.buyer.name} - {liveCart.buyer.phone}</p>
                                        <p className="text-[10px] text-gray-500">📱 {liveCart.buyer.device} | 🌐 {liveCart.buyer.ip}</p>
                                    </div>
                                    {liveCart.status === 'approved' && <span className="bg-emerald-500 text-white px-2 py-0.5 md:px-3 md:py-1 rounded-full text-[10px] md:text-xs font-bold w-fit">تم البيع</span>}
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 max-h-32 overflow-y-auto scrollbar-hide mb-4">
                                    {liveCart.items.map(item => (
                                        <div key={item.barcode} className="bg-white p-1.5 md:p-2 rounded-lg text-[10px] md:text-xs shadow-sm flex items-center gap-1.5">
                                            <ProductImage src={item.image} alt={item.name} className="w-7 h-7 md:w-8 md:h-8 rounded object-cover" />
                                            <div>
                                                <p className="font-bold text-gray-800">{item.name}</p>
                                                <p className="text-gray-500">× {item.qty}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {liveCart.status === 'pending' && (
                                    <button onClick={approveOrder} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 md:py-3 rounded-xl font-bold text-sm md:text-base">
                                        ✅ موافقة وتأكيد البيع (تخزين)
                                    </button>
                                )}
                                {liveCart.status === 'approved' && (
                                    <button onClick={clearCartForNewCustomer} className="w-full bg-gray-800 hover:bg-gray-900 text-white py-2.5 md:py-3 rounded-xl font-bold text-sm md:text-base">
                                        استقبال عميل جديد (مسح السلة)
                                    </button>
                                )}
                            </>
                        ) : <p className="text-gray-400 text-xs md:text-sm mb-4 text-center py-4">لا يوجد مشتري نشط حالياً.</p>}
                    </div>

                    <div className="grid grid-cols-3 gap-2 md:gap-6">
                        <div className="glass-card p-3 md:p-6 rounded-xl md:rounded-3xl shadow-lg border-r-4 border-blue-500">
                            <p className="text-blue-500 text-[10px] md:text-sm font-bold">المبيعات</p>
                            <h2 className="text-base md:text-3xl font-extrabold text-blue-900 mt-1 md:mt-2">{totalRevenue.toFixed(0)}<span className="text-[10px] md:text-lg"> {mallInfo.currency}</span></h2>
                        </div>
                        <div className="glass-card p-3 md:p-6 rounded-xl md:rounded-3xl shadow-lg border-r-4 border-cyan-500">
                            <p className="text-cyan-500 text-[10px] md:text-sm font-bold">المنتجات</p>
                            <h2 className="text-base md:text-3xl font-extrabold text-blue-900 mt-1 md:mt-2">{Object.keys(mallInfo.products).length}</h2>
                        </div>
                        <div className="glass-card p-3 md:p-6 rounded-xl md:rounded-3xl shadow-lg border-r-4 border-indigo-500">
                            <p className="text-indigo-500 text-[10px] md:text-sm font-bold">العملاء</p>
                            <h2 className="text-base md:text-3xl font-extrabold text-blue-900 mt-1 md:mt-2">{transactions.length}</h2>
                        </div>
                    </div>

                    <div className="glass-card rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-6">
                        <div className="flex justify-between items-center mb-4 md:mb-6">
                            <h2 className="text-lg md:text-2xl font-extrabold text-blue-900">إدارة المنتجات</h2>
                            <button onClick={() => setShowProductForm(!showProductForm)} className="gradient-btn text-white px-3 py-2 md:px-6 md:py-3 rounded-lg md:rounded-xl font-bold text-xs md:text-sm flex items-center gap-1 md:gap-2">
                                <svg className="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                إضافة
                            </button>
                        </div>

                        {/* نموذج إضافة قسم جديد (تم إعادته) */}
                        <form onSubmit={addCategory} className="flex gap-2 mb-6 p-4 bg-blue-50/50 rounded-2xl border border-blue-100">
                            <input type="text" value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="إضافة قسم جديد (مثال: منظفات)" className="w-full px-4 py-2 bg-white rounded-xl outline-none border border-blue-100 focus:ring-2 focus:ring-blue-500" required />
                            <button type="submit" className="bg-blue-800 text-white px-6 py-2 rounded-xl font-bold text-sm whitespace-nowrap">إضافة القسم</button>
                        </form>

                        {showProductForm && (
                            <form onSubmit={addProduct} className="bg-white p-3 md:p-6 rounded-xl md:rounded-2xl mb-6 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4 border-2 border-blue-200">
                                <div className="md:col-span-2 text-base md:text-lg font-bold text-blue-900 border-b pb-2 mb-2">تفاصيل المنتج الجديد</div>
                                <div>
                                    <label className="block text-[10px] md:text-xs font-bold text-gray-600 mb-1">الباركود</label>
                                    <input type="text" value={pBarcode} onChange={e=>setPBarcode(e.target.value)} className="w-full px-3 py-2 md:px-4 md:py-2 bg-blue-50 rounded-lg outline-none text-sm" required />
                                </div>
                                <div>
                                    <label className="block text-[10px] md:text-xs font-bold text-gray-600 mb-1">اسم المنتج</label>
                                    <input type="text" value={pName} onChange={e=>setPName(e.target.value)} className="w-full px-3 py-2 md:px-4 md:py-2 bg-blue-50 rounded-lg outline-none text-sm" required />
                                </div>
                                <div>
                                    <label className="block text-[10px] md:text-xs font-bold text-gray-600 mb-1">السعر</label>
                                    <input type="number" step="0.1" value={pPrice} onChange={e=>setPPrice(e.target.value)} className="w-full px-3 py-2 md:px-4 md:py-2 bg-blue-50 rounded-lg outline-none text-sm" required />
                                </div>
                                <div>
                                    <label className="block text-[10px] md:text-xs font-bold text-gray-600 mb-1">القسم</label>
                                    <select value={pCategory} onChange={e=>setPCategory(e.target.value)} className="w-full px-3 py-2 md:px-4 md:py-2 bg-blue-50 rounded-lg outline-none text-sm">
                                        {mallInfo.categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <div className="md:col-span-2">
                                    <label className="block text-[10px] md:text-xs font-bold text-gray-600 mb-1">صورة المنتج</label>
                                    <input type="file" accept="image/*" onChange={e => resizeImage(e.target.files[0], 100, (uri) => setPImage(uri))} className="w-full px-3 py-2 md:px-4 md:py-2 bg-blue-50 rounded-lg outline-none text-sm" required />
                                    {pImage && <img src={pImage} alt="preview" className="mt-2 w-16 h-16 md:w-20 md:h-20 rounded-lg object-cover" />}
                                </div>
                                <div className="md:col-span-2 flex gap-2">
                                    <button type="submit" className="w-full gradient-btn text-white py-2 md:py-3 rounded-lg md:rounded-xl font-bold text-sm">حفظ</button>
                                    <button type="button" onClick={() => setShowProductForm(false)} className="bg-gray-200 text-gray-700 px-4 md:px-6 py-2 md:py-3 rounded-lg md:rounded-xl font-bold text-sm">إلغاء</button>
                                </div>
                            </form>
                        )}

                        <div className="flex gap-2 overflow-x-auto scrollbar-hide mb-4 md:mb-6 border-b border-blue-100 pb-3 md:pb-4">
                            {mallInfo.categories.map(cat => (
                                <button key={cat} onClick={() => setActiveCategory(cat)} className={`px-4 py-2 rounded-lg md:rounded-xl font-bold text-xs md:text-sm whitespace-nowrap ${activeCategory === cat ? 'gradient-btn text-white' : 'bg-blue-50 text-blue-600'}`}>{cat}</button>
                            ))}
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 md:gap-4">
                            {filteredProducts.map(barcode => {
                                const p = mallInfo.products[barcode];
                                return (
                                    <div key={barcode} className="bg-white rounded-xl md:rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                        <div className="h-20 md:h-32 bg-gray-100">
                                            <ProductImage src={p.image} alt={p.name} className="w-full h-full object-cover" />
                                        </div>
                                        <div className="p-2 md:p-4">
                                            <h4 className="font-bold text-blue-900 text-xs md:text-base">{p.name}</h4>
                                            <p className="text-emerald-600 font-bold mb-2 md:mb-3 text-xs md:text-base">{p.price.toFixed(2)} {mallInfo.currency}</p>
                                            {confirmDel === barcode ? (
                                                <div className="flex gap-1 md:gap-2">
                                                    <button onClick={() => executeDelete(barcode)} className="flex-1 bg-red-500 text-white py-1 rounded-md text-[10px] md:text-xs font-bold">تأكيد</button>
                                                    <button onClick={() => setConfirmDel(null)} className="flex-1 bg-gray-200 py-1 rounded-md text-[10px] md:text-xs font-bold">إلغاء</button>
                                                </div>
                                            ) : (
                                                <button onClick={() => setConfirmDel(barcode)} className="w-full text-red-500 border border-red-100 py-1 rounded-md text-[10px] md:text-xs font-bold">حذف</button>
                                            )}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>

                    <div className="glass-card rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg md:text-2xl font-extrabold text-blue-900">سجل المشتريات التفصيلي</h2>
                            {transactions.length > 0 && (
                                confirmClearAll ? (
                                    <div className="flex gap-2">
                                        <button onClick={clearAllTransactions} className="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">تأكيد حذف الكل</button>
                                        <button onClick={() => setConfirmClearAll(false)} className="bg-gray-200 text-gray-700 px-3 py-1 rounded-lg text-xs font-bold">إلغاء</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setConfirmClearAll(true)} className="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-xs font-bold border border-red-200 hover:bg-red-200">حذف الكل</button>
                                )
                            )}
                        </div>
                        <div className="overflow-x-auto scrollbar-hide">
                            <table className="w-full text-right border-collapse min-w-[600px]">
                                <thead>
                                    <tr className="border-b-2 border-blue-100 text-blue-800">
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">المشتري</th>
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">الهاتف</th>
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">الأغراض</th>
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">المبلغ</th>
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">الوقت</th>
                                        <th className="p-2 md:p-3 text-[10px] md:text-sm">إجراء</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {transactions.length === 0 ? (
                                        <tr><td colSpan="6" className="text-center p-8 text-blue-300 text-sm">لا توجد مبيعات مسجلة.</td></tr>
                                    ) : (
                                        transactions.map((tx, idx) => (
                                            <tr key={tx.id || idx} className="border-b border-blue-50 hover:bg-gray-50">
                                                <td className="p-2 md:p-3 font-bold text-blue-900 text-xs md:text-sm">{tx.buyer?.name || '-'}</td>
                                                <td className="p-2 md:p-3 text-gray-600 text-xs md:text-sm">{tx.buyer?.phone || '-'}</td>
                                                <td className="p-2 md:p-3 text-[10px] md:text-xs text-gray-500 max-w-[150px] md:max-w-xs truncate">
                                                    {tx.items.map(i => `${i.name}(${i.qty})`).join('، ')}
                                                </td>
                                                <td className="p-2 md:p-3 font-bold text-emerald-600 text-xs md:text-sm">{tx.total.toFixed(2)}</td>
                                                <td className="p-2 md:p-3 text-[10px] md:text-xs text-gray-400">{new Date(tx.date).toLocaleTimeString('ar-EG')}</td>
                                                <td className="p-2 md:p-3 text-center">
                                                    {confirmDelTx === tx.id ? (
                                                        <div className="flex gap-1 justify-center">
                                                            <button onClick={() => deleteTransaction(tx.id)} className="bg-red-500 text-white px-2 py-1 rounded-md text-[10px] font-bold">نعم</button>
                                                            <button onClick={() => setConfirmDelTx(null)} className="bg-gray-200 px-2 py-1 rounded-md text-[10px] font-bold">لا</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => setConfirmDelTx(tx.id)} className="text-red-500 hover:bg-red-50 p-1 rounded-md transition">
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
